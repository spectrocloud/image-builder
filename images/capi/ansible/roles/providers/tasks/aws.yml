---
- name: install pinned versoin of pystache==0.5.4
  pip:
    name: "{{ packages }}"
  vars:
    packages:
      - pystache==0.5.4

- name: install aws clients
  pip:
    name: "{{ packages }}"
  vars:
    packages:
      - https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-latest.tar.gz
      - awscli

- name: install futures for python 2.7
  pip:
    name: "futures"
  when: ansible_os_family == "RedHat"

- name: uninstall default rsa
  pip:
    name: "rsa"
    state: absent
  when: ansible_os_family == "RedHat"

- name: install rsa==4.0
  pip:
    name: rsa==4.0
  when: ansible_os_family == "RedHat"

#  pip install --upgrade botocore==1.21.57
- name: botocore downgrade
  pip:
    name: botocore==1.21.57
    extra_args: --upgrade
  when: ansible_os_family == "RedHat"